### application.properties

# Spring Application Configuration
spring.application.name=csv-processor-service

# Local PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db_local
spring.datasource.username=dev_user
spring.datasource.password=dev_password

# PostgreSQL Configuration for Spark JDBC (Local)
postgresql.url=jdbc:postgresql://localhost:5432/trading_db_local
postgresql.username=dev_user
postgresql.password=dev_password
postgresql.driver=org.postgresql.Driver

# Local Spark Configuration
spark.app.name=CsvToPostgreSqlProcessor-Local
spark.master=local[2]

# Local File Paths
processor.csv-file-path=${CSV_FILE_PATH:/tmp/test-data/trades.csv}
processor.process-name=${PROCESS_NAME:trade-ingestion}
processor.interval=${EXECUTION_INTERVAL:once}

# Enhanced Logging for Development
logging.level.com.example.csvprocessor=DEBUG
logging.level.com.example.csvprocessor.dao=DEBUG
logging.level.com.example.csvprocessor.service=DEBUG
logging.level.com.example.csvprocessor.adapter=DEBUG
logging.level.org.apache.spark=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.root=INFO

# Development-specific settings
processor.enable-scheduling=false
processor.max-retries=1
processor.retry-delay-ms=1000

# Connection Pool Settings for Development
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000