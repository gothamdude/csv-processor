# Spring Application Configuration
spring.application.name=csv-processor

# DataSource Configuration for Spring JDBC
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trading_db}
spring.datasource.username=${DATABASE_USER:trading_user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# PostgreSQL Configuration for Spark JDBC
postgresql.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trading_db}
postgresql.username=${DATABASE_USER:trading_user}
postgresql.password=${DATABASE_PASSWORD:password}
postgresql.driver=org.postgresql.Driver

# Spark Configuration
spark.app.name=CsvToPostgreSqlProcessor
spark.master=local[*]

# Processor Configuration
processor.csv-file-path=${CSV_FILE_PATH:/data/input/trades.csv}
processor.process-name=${PROCESS_NAME:trade-ingestion}
processor.interval=${EXECUTION_INTERVAL:once}
processor.enable-scheduling=false
processor.max-retries=3
processor.retry-delay-ms=5000

# Logging Configuration
logging.level.com.example.csvprocessor=INFO
logging.level.com.example.csvprocessor.dao=DEBUG
logging.level.org.apache.spark=WARN
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.root=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n